      # UNRESOLVED iken legacy NotificationQueue formülüne düştüğünü ve tenant-isolation'ı
      # doğrular.
      - name: MPB-028(a) PR-5 calculateNextActionTime cutover disposable-DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/automation/__tests__/workflow-engine-legal-time-cutover.db-gated.integration.spec.ts || \
            { echo "MISSING MPB-028(a) PR-5 DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="workflow-engine-legal-time-cutover\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # LRV-02 / DBP-P2-SEC-P01: UyapXmlService.mapDebtorRoleToUyapKod DebtorRole->UYAP rol-kodu
      # mapping regresyonu (PR #1322). Yukarıdaki dar allowlist pattern'lerinin hiçbirine girmiyordu
      # → CI'da hiç koşmuyordu (yalnız o merge'in GO-IMPLEMENT'inde local `npx jest` ile doğrulandı).
      # Ayrı/açık step; dosya-varlığı pre-check (rename/silme/0-eşleşme → CI RED) + passWithNoTests YOK.
      - name: LRV-02 UYAP XML DebtorRole mapping regression tests
        run: |
          cd apps/api
          test -f src/modules/uyap/__tests__/uyap-xml.debtor-role-mapping.spec.ts || \
            { echo "MISSING LRV-02 spec: uyap-xml.debtor-role-mapping.spec.ts"; exit 1; }
          npx jest --ci --forceExit \
            --testPathPattern="uyap-xml\.debtor-role-mapping\.spec\.ts$" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      # DBP-P2-SEC-P02: UyapCaseMapperService.mapDebtorRole (ikinci UYAP mapper) DebtorRole->rol
      # behavior-lock regresyonu (PR #1327). Yukarıdaki dar allowlist pattern'lerinin hiçbirine
