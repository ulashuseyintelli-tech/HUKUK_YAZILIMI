# CI Pipeline - Core Checks
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Aynı ref için devam eden eski koşuyu iptal et (maliyet: çift/yığılan run önleme).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project

jobs:
  architectural-guardrails:
    name: Architectural Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Governance writer coordination V1 guard
        env:
          GOV_COORD_EVENT_NAME: ${{ github.event_name }}
          GOV_COORD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOV_COORD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GOV_COORD_HEAD_REF: ${{ github.head_ref }}
        run: |
          node scripts/governance-coordination.cjs self-test
          node --test scripts/governance-coordination.test.cjs
          node scripts/governance-coordination.cjs validate-template request docs/governance/coordination-requests/_template/request.md
          node scripts/governance-coordination.cjs validate-template result docs/governance/coordination-results/_template/result.md
          node scripts/governance-coordination.cjs verify-register
          if [ "$GOV_COORD_EVENT_NAME" = "pull_request" ]; then
            node scripts/governance-coordination.cjs validate-pr-scope \
              --base "$GOV_COORD_BASE_SHA" \
              --head "$GOV_COORD_HEAD_SHA" \
              --head-ref "$GOV_COORD_HEAD_REF"
          else
            node scripts/governance-coordination.cjs validate-repository
          fi
      - name: ADR-007 check
        run: |
          if grep -r "req\.idempotencyContext\s*=" apps/api/src/; then
            echo "ADR-007 VIOLATION"; exit 1
          fi
      - name: CI-1 Bare fetch gate
        run: bash apps/api/scripts/ci-1-bare-fetch-gate.sh
      - name: CI-2 PII log leak gate
        run: bash apps/api/scripts/ci-2-pii-log-leak-gate.sh
      - name: CI-3 Scheduler unbounded gate
        run: bash apps/api/scripts/ci-3-scheduler-unbounded-gate.sh
      - name: CI-4 Trust proxy gate
        run: bash apps/api/scripts/ci-4-trust-proxy-gate.sh
      - name: CI-5 Scheduler metrics gate
        run: bash apps/api/scripts/ci-5-scheduler-metrics-gate.sh
      - name: CI-6 Symbol token singleton gate
        run: bash apps/api/scripts/ci-6-symbol-token-singleton-gate.sh
      - name: CI-7 Web no submission-level promote gate
        run: bash apps/api/scripts/ci-7-web-no-submission-promote-gate.sh
      - name: CI-8 Jest invocation budget gate
        run: bash apps/api/scripts/ci-8-jest-invocation-budget-gate.sh

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    # GH-03: job seviyesinde timeout yoktu → GitHub default'u 360 dk. Konsolidasyon
    # sonrasi beklenen sure ~13 dk; 20 dk sinir kacak bir job'i sinirlar, normal
    # kosuya mudahale etmez (client-workspace-live-smoke ile ayni deger).
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 8.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: project
      - name: Prisma generate
        run: pnpm --filter @hukuk/api exec prisma generate
        working-directory: project
      - name: Prisma migrate deploy
        run: pnpm --filter @hukuk/api exec prisma migrate deploy
        working-directory: project
      - name: Type check
        run: pnpm --filter @hukuk/api exec tsc --noEmit -p tsconfig.prod.json
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/uyap-icrabot-tebligat.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/uyap-icrabot-tebligat
        run: bash apps/api/scripts/run-ci-manifest.sh pure/uyap-icrabot-tebligat
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/client-portal.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/client-portal
        run: bash apps/api/scripts/run-ci-manifest.sh pure/client-portal
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/office-auth-user.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/office-auth-user
        run: bash apps/api/scripts/run-ci-manifest.sh pure/office-auth-user
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/claim-collection-finance.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/claim-collection-finance
        run: bash apps/api/scripts/run-ci-manifest.sh pure/claim-collection-finance
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/platform-scripts-shared.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/platform-scripts-shared
        run: bash apps/api/scripts/run-ci-manifest.sh pure/platform-scripts-shared
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/db/core-lifecycle.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: db/core-lifecycle
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: bash apps/api/scripts/run-ci-manifest.sh db/core-lifecycle
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/db/domain-integration.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: db/domain-integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: bash apps/api/scripts/run-ci-manifest.sh db/domain-integration
        working-directory: project
      # Spec listesi: project/apps/api/ci-manifests/pure/architecture-guards.txt
      # (ci.yml control-plane; manifest dosyasi degil — spec eklemek binding istemez)
      - name: pure/architecture-guards
        run: bash apps/api/scripts/run-ci-manifest.sh pure/architecture-guards
        working-directory: project
      - name: PR-A4-2 rich-interest diagnostic fixture and disposable DB evidence
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          for f in src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.spec.ts \
                   src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.db-gated.integration.spec.ts; do
            test -f "$f" || { echo "MISSING PR-A4-2 spec: $f"; exit 1; }
          done
          set -o pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="rich-interest-uyap-readiness\.fixture(\.db-gated\.integration)?\.spec\.ts$" \
            2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+2 passed, 2 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 suites did not execute exactly twice"; exit 1; }
          grep -Eq "Tests:[[:space:]]+49 passed, 49 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 tests did not execute 49/49"; exit 1; }
        working-directory: project
      - name: ADR014-PE-06A disabled local evidence harness tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-disabled-local-evidence-harness.ts
          functional_spec=src/scripts/__tests__/adr014-disabled-local-evidence-harness.spec.ts
          security_spec=src/scripts/__tests__/adr014-disabled-local-evidence-harness.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06A file: $f"; exit 1; }
          done
          for pattern in '@nestjs/' '@prisma/' 'node:fs' 'node:path' 'node:http' 'node:https' \
                         'node:net' 'node:tls' 'AuditService' 'AuditLog' 'prom-client' \
                         'worker_threads' 'balance-display-shadow-diff' "from 'fs'" 'from "fs"' \
                         "from 'path'" 'from "path"' "from 'http'" 'from "http"' \
                         "from 'https'" 'from "https"' "from 'net'" 'from "net"' \
                         "from 'tls'" 'from "tls"' 'axios' 'fetch(' 'cron' 'bullmq' 'ioredis'; do
            if grep -F -n "$pattern" "$source_file" "$functional_spec" "$security_spec"; then
              echo "FORBIDDEN ADR014-PE-06A dependency: $pattern"; exit 1
            fi
          done
          if grep -E -n 'require\.main|process\.argv|process\.env|NestFactory|function[[:space:]]+main|Math\.random|randomUUID|Date\.' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06A execution or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|amount|principal|interest|fee|rawError|stack|reason|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06A payload field"; exit 1
          fi
        working-directory: project
      # ADR014-PE-06C1 remains preparation-only: v1 compatibility and the v2 mapper must stay
      # default-disabled, pure and dependency-free while all direct specs execute explicitly.
      - name: ADR014-PE-06C1 default-disabled observation contract tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-session-observation-producer.ts
          functional_spec=src/scripts/__tests__/adr014-session-observation-producer.spec.ts
          security_spec=src/scripts/__tests__/adr014-session-observation-producer.security.spec.ts
          compatibility_spec=src/modules/balance-display-shadow-diff/__tests__/balance-display-shadow-diff.events.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec" "$compatibility_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06C1 file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|http|https|net|tls|crypto)|process\.(env|argv)|NestFactory|Date\.|new Date|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|prom-client|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06C1 runtime or nondeterminism surface"; exit 1
          fi
        working-directory: project
      # ADR014-PE-06D composes PE-06A/B1/C1 only in a default-disabled, synthetic,
      # test-only dry-validation shell. Runtime activation and external I/O remain forbidden.
      - name: ADR014-PE-06D local session orchestrator dry-validation tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-session-orchestrator-dry-validation.ts
          functional_spec=src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06D file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|path|http|https|net|tls|crypto)|process\.(env|argv)|NestFactory|new Date|Date\.|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06D runtime, I/O or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|principal|interest|fee|amount|currency|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06D business or financial payload field"; exit 1
          fi
        working-directory: project
      # ADR014-PE-06E defines only pure, default-disabled local preparation contracts.
      # Audit persistence, evidence acceptance, runtime telemetry, and alert delivery stay absent.
      - name: ADR014-PE-06E local observability surface contract tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-observability-surfaces.ts
          functional_spec=src/scripts/__tests__/adr014-local-observability-surfaces.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-observability-surfaces.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06E file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|path|http|https|net|tls)|process\.(env|argv)|NestFactory|Date\.now|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06E runtime, I/O or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|amount|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06E business or sensitive payload field"; exit 1
          fi
        working-directory: project
      # ADR014-REP-01B is an exact local execution boundary, not an activated run.
      # It must remain default-disabled, local-only, read-only and free of network clients.
      - name: ADR014-REP-01B local read-only representative runner tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-read-only-representative-runner.ts
          functional_spec=src/scripts/__tests__/adr014-local-read-only-representative-runner.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-read-only-representative-runner.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01B file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|node:(http|https|net|tls|dgram)|process\.(env|argv)|NestFactory|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01B runtime, egress or activation surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01B business or sensitive payload field"; exit 1
          fi
          grep -F -q 'SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY' "$source_file" || \
            { echo "MISSING ADR014-REP-01B read-only transaction guard"; exit 1; }
        working-directory: project
      # ADR014-REP-01A validates run-specific owner references only. It cannot access data,
      # execute the runner, emit telemetry or promote evidence/PR-11/runtime authority.
      - name: ADR014-REP-01A run-specific authorization package tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-run-specific-authorization-package.ts
          functional_spec=src/scripts/__tests__/adr014-run-specific-authorization-package.spec.ts
          security_spec=src/scripts/__tests__/adr014-run-specific-authorization-package.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01A file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|http|https|net|tls|dgram)|process\.(env|argv)|NestFactory|PrismaClient|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A runtime, persistence, egress or activation surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|rawError|stack|arbitraryMetadata' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A business or sensitive payload field"; exit 1
          fi
        working-directory: project
      # ADR014-REP-01A-R2-I1 materializes owner decisions only. Runtime facts, execution,
      # data access and authority promotion remain forbidden.
      - name: ADR014-REP-01A-R2-I1 v2 pre-run package instance tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-v2-pre-run-package-instance.ts
          functional_spec=src/scripts/__tests__/adr014-v2-pre-run-package-instance.spec.ts
          security_spec=src/scripts/__tests__/adr014-v2-pre-run-package-instance.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01A-R2-I1 file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|http|https|net|tls|dgram)|process\.(env|argv)|NestFactory|PrismaClient|fetch\(|axios|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A-R2-I1 runtime, persistence, egress or activation surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|password|secret|connectionString|databaseUrl|\bamount\b' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A-R2-I1 identity, credential or financial payload"; exit 1
          fi
        working-directory: project
      # ADR014-REP-02 is an owner-authorized local-only execution call-site. CI exercises
      # only mocks/static guards; it never reads local or representative data.
      - name: ADR014-REP-02 local representative execution contract tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-rep-02-local-execution.ts
          runner_source=src/scripts/adr014-local-read-only-representative-runner.ts
          functional_spec=src/scripts/__tests__/adr014-rep-02-local-execution.spec.ts
          security_spec=src/scripts/__tests__/adr014-rep-02-local-execution.security.spec.ts
          for f in "$source_file" "$runner_source" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-02 file: $f"; exit 1; }
          done
          grep -F -q 'ADR014_REPRESENTATIVE_RUNNER_READ_ONLY_SQL' "$source_file" || \
            { echo "MISSING ADR014-REP-02 canonical read-only transaction binding"; exit 1; }
          grep -F -q 'SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY' "$runner_source" || \
            { echo "MISSING ADR014-REP-02 read-only transaction guard"; exit 1; }
          if grep -E -n "node:(http|https|net|tls|dgram)|from ['\"](axios|openai|ioredis|prom-client)|@aws-sdk|NestFactory|createApplicationContext|fetch\(" "$source_file"; then
            echo "FORBIDDEN ADR014-REP-02 external egress, telemetry or runtime bootstrap surface"; exit 1
          fi
        working-directory: project
      - name: ADR-014 PR-1B real cancellation disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/collection/__tests__/collection-cancel-reversal.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-1B DB-gated spec"; exit 1; }
          set -o pipefail
          output_file="$(mktemp)"
          npx jest --ci --forceExit --runInBand --verbose \
            --testPathPattern="src/modules/collection/__tests__/collection-cancel-reversal\.db-gated\.integration\.spec\.ts$" \
            2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+1 passed, 1 total" "$output_file" || \
            { echo "BLOCKED: ADR-014 PR-1B DB suite did not execute exactly once"; exit 1; }
          awk '/^[[:space:]]*Tests:/ { seen = 1; passed = $2; total = $4 } END { exit !(seen && passed ~ /^[0-9]+$/ && total ~ /^[0-9]+$/ && passed == total && total > 0) }' "$output_file" || \
            { echo "BLOCKED: ADR-014 PR-1B DB tests did not complete with every discovered test passing"; exit 1; }
        working-directory: project
      - name: CI-8 Icrabot governance guard
        run: |
          test -f scripts/ci-8-icrabot-governance-guard.cjs || { echo "MISSING CI-8 guard script: scripts/ci-8-icrabot-governance-guard.cjs"; exit 1; }
          node scripts/ci-8-icrabot-governance-guard.cjs
        working-directory: project/apps/api
      - name: UYAP-P05A-R1 operation/attempt schema static contract
        run: |
          spec=src/modules/uyap/__tests__/uyap-operation-attempt-schema.static.spec.ts
          migration=prisma/migrations/20260722170000_uyap_operation_attempt_schema_foundation_r1/migration.sql
          test -f "$spec" || { echo "MISSING P05A-R1 static spec: $spec"; exit 1; }
          test -f "$migration" || { echo "MISSING P05A-R1 migration: $migration"; exit 1; }
          if grep -inE '^[[:space:]]*(update|insert|delete|truncate|drop)[[:space:]]' "$migration"; then
            echo "FORBIDDEN P05A-R1 non-additive DML statement in migration"; exit 1
          fi
          if grep -inE '^[[:space:]]*alter[[:space:]].*(drop|rename)' "$migration"; then
            echo "FORBIDDEN P05A-R1 destructive ALTER (drop/rename) in migration"; exit 1
          fi
        working-directory: project/apps/api
      - name: UYAP-P05A-R1 operation/attempt schema disposable DB acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          spec=src/modules/uyap/__tests__/uyap-operation-attempt-schema.db-gated.integration.spec.ts
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f "$spec" || { echo "MISSING P05A-R1 DB-gated spec: $spec"; exit 1; }
          set -o pipefail
          output_file="$(mktemp)"
          pnpm exec jest --ci --forceExit --runInBand --runTestsByPath "$spec" 2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+1 passed, 1 total" "$output_file" || \
            { echo "BLOCKED: P05A-R1 DB suite did not execute exactly once"; exit 1; }
          awk '/^[[:space:]]*Tests:/ { seen=1; passed=$2; total=$4 } END { exit !(seen && passed ~ /^[0-9]+$/ && total ~ /^[0-9]+$/ && passed==total && total>0) }' "$output_file" || \
            { echo "BLOCKED: P05A-R1 DB tests did not complete with every discovered test passing"; exit 1; }
        working-directory: project/apps/api
      # UYAP-OPERATION-ATTEMPT-WRITER-P05B (F4-b/P-E5B): dormant internal writer foundation.
      # STEP 1 unit + DORMANCY/BOUNDARY guard: UyapModule writer'i KAYDETMEZ, UyapService import ETMEZ,
      # writer UyapRequestLog'a dokunmaz, state mutation (internalState/provider/legal-effect) YAPMAZ,
      # controller/DTO/schema dosyasi yoktur; branded idempotency key client string'inden uretilemez.
      # Dosya-varligi guard'ina EK olarak grep tabanli dormancy kontrolu: kayit/injection eklenirse RED.
      # STEP 2 disposable PostgreSQL 16'da esszamanli advisory-lock serilestirmesi, gap-free attempt
      # lineage'i ve optimistic compare-and-bump'i dogrular; skipped/zero-test RED.
      - name: UYAP-P05B operation writer unit and dormancy guard
        run: |
          spec=src/modules/uyap/operation-writer/uyap-operation-writer.service.spec.ts
          writer=src/modules/uyap/operation-writer/uyap-operation-writer.service.ts
          for f in "$spec" "$writer" \
                   src/modules/uyap/operation-writer/uyap-operation-writer.types.ts \
                   src/modules/uyap/operation-writer/uyap-operation-writer.errors.ts \
                   src/modules/uyap/operation-writer/uyap-operation-writer-lock.ts; do
            test -f "$f" || { echo "MISSING P05B file: $f"; exit 1; }
          done
          # P05C-P04 UYARLAMASI: writer artık YETKİLİ (module kaydı + orchestrator). Guard DARALTILDI:
          # UyapService raw operation-writer'ı DOĞRUDAN kullanamaz (yalnız orchestrator yoluyla).
          if grep -nE 'UyapOperationWriterService' src/modules/uyap/uyap.service.ts; then
            echo "FORBIDDEN P05C-P04: UyapService raw operation-writer'i DOGRUDAN kullanamaz (yalniz orchestrator)"; exit 1
          fi
          if grep -nE '\.uyapRequestLog|Controller|CasePolicyEngine|cpeDecisionLog' "$writer"; then
