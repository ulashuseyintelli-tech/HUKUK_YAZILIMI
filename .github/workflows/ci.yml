          grep -Eq "Test Suites:[[:space:]]+1 passed, 1 total" "$output_file" || \
            { echo "BLOCKED: P05C-P01 DB suite did not execute exactly once"; exit 1; }
          awk '/^[[:space:]]*Tests:/ { seen=1; passed=$2; total=$4 } END { exit !(seen && passed ~ /^[0-9]+$/ && total ~ /^[0-9]+$/ && passed==total && total>0) }' "$output_file" || \
            { echo "BLOCKED: P05C-P01 DB tests did not complete with every discovered test passing"; exit 1; }
        working-directory: project/apps/api
      # UYAP-ATTEMPT-CPE-DECISION-LINK-P05C-P02: dormant link schema foundation + Policy Engine
      # referential legal-hold. Kardinalite 1 attempt -> N karar; AYNI kararin baska attempt'e
      # baglanmasi UYAP-CONST-002 geregi YASAK (@@unique([cpeDecisionLogId])). role/disposition
      # kolonu YOK. Uc composite FK case-attribution zincirini kapatir; ucu de ON DELETE RESTRICT.
      # STEP 1 statik kontrat + migration/dormancy guard: link'e YAZAN uretim kodu, controller/DTO,
      # Cascade/SetNull, role/disposition veya CpeDecisionLog.tenantId gorulurse RED.
      # STEP 2 disposable PostgreSQL 16: FK zinciri, cardinality reddi, fail-closed delete ve
      # retention'in bagli kaydi SILMEMESI + bagli satir yuzunden HATA VERMEMESI dogrulanir.
      - name: P05C-P02 UyapAttemptCpeDecisionLink static contract
        run: |
          spec=src/modules/policy-engine/decision-logger/__tests__/uyap-attempt-cpe-decision-link.static.spec.ts
          migration=prisma/migrations/20260723010000_uyap_attempt_cpe_decision_link/migration.sql
          test -f "$spec" || { echo "MISSING P05C-P02 static spec: $spec"; exit 1; }
          test -f "$migration" || { echo "MISSING P05C-P02 migration: $migration"; exit 1; }
          restricts="$(grep -c 'ON DELETE RESTRICT' "$migration")"
          test "$restricts" -eq 3 || { echo "FORBIDDEN P05C-P02: expected exactly 3 ON DELETE RESTRICT (found $restricts)"; exit 1; }
          if grep -nE 'ON DELETE (CASCADE|SET NULL)|ADD COLUMN|^[[:space:]]*(UPDATE|INSERT|DELETE|TRUNCATE|DROP)[[:space:]]' "$migration"; then
            echo "FORBIDDEN P05C-P02: destructive delete action, column change or DML in migration"; exit 1
          fi
          # P05C-P03 UYARLAMASI: yetkili link writer (uyap-cpe-decision-link-writer.service.ts, Karar C)
          # link tablosuna yazar. Guard DARALTILIR: yetkili writer ve testler HARIC baska hicbir
          # uretim kodu link tablosuna YAZMAMALI (yetkisiz ikinci writer / sizinti hala RED).
          if grep -rnE 'uyapAttemptCpeDecisionLink[[:space:]]*\.[[:space:]]*(create|createMany|upsert)' src --include='*.ts' \
               | grep -vE '__tests__|\.spec\.ts' | grep -v 'uyap-cpe-decision-link-writer.service.ts'; then
            echo "FORBIDDEN P05C-P02: yetkisiz link writer (yalnizca P05C-P03 uyap-cpe-decision-link-writer yazabilir)"; exit 1
          fi
        working-directory: project/apps/api
      - name: P05C-P02 link + referential legal-hold disposable DB acceptance
