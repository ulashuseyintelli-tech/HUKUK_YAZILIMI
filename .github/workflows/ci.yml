        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/legal-deadline/__tests__/proceeding-classification.db-gated.integration.spec.ts || \
            { echo "MISSING MPB-028(a) PR-3C DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="proceeding-classification\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # MPB-028(a) PR-4 (owner revizyonu 2026-07-14 — "PR-4 dar düzeltme"): Consumer-by-Consumer
      # Read-Only Cutover — kesinleştirme talebi uygunluk süre hesabını (finalizationRequest-
      # EligibleDate/finalizationEligibilitySource) LEGAL_TIME_CUTOVER flag'i altında kanonik
      # hukuki süre motoruna yönlendirir. `finalizationDate` (LEGACY PROJECTION — GERÇEK kesinleşme olgusu
      # DEĞİL, itiraz/durdurucu-etki fact'i henüz kanonik olarak modellenmediği için) bu PR'da
      # hiçbir canonical hesapla doldurulmaz, flag'den bağımsız kalır; flag açıkken UI ASLA
