# CI Pipeline - Core Checks
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı ref için devam eden eski koşuyu iptal et (maliyet: çift/yığılan run önleme).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project

jobs:
  architectural-guardrails:
    name: Architectural Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-007 check
        run: |
          if grep -r "req\.idempotencyContext\s*=" apps/api/src/; then
            echo "ADR-007 VIOLATION"; exit 1
          fi
      - name: CI-1 Bare fetch gate
        run: bash apps/api/scripts/ci-1-bare-fetch-gate.sh
      - name: CI-2 PII log leak gate
        run: bash apps/api/scripts/ci-2-pii-log-leak-gate.sh
      - name: CI-3 Scheduler unbounded gate
        run: bash apps/api/scripts/ci-3-scheduler-unbounded-gate.sh
      - name: CI-4 Trust proxy gate
        run: bash apps/api/scripts/ci-4-trust-proxy-gate.sh
      - name: CI-5 Scheduler metrics gate
        run: bash apps/api/scripts/ci-5-scheduler-metrics-gate.sh
      - name: CI-6 Symbol token singleton gate
        run: bash apps/api/scripts/ci-6-symbol-token-singleton-gate.sh
      - name: CI-7 Web no submission-level promote gate
        run: bash apps/api/scripts/ci-7-web-no-submission-promote-gate.sh

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: project
      - name: Prisma generate
        run: pnpm --filter @hukuk/api exec prisma generate
        working-directory: project
      - name: Prisma migrate deploy
        run: pnpm --filter @hukuk/api exec prisma migrate deploy
        working-directory: project
      - name: Type check
        run: pnpm --filter @hukuk/api exec tsc --noEmit -p tsconfig.prod.json
        working-directory: project
      - name: Tests
        run: |
          cd apps/api
          npx jest --ci --forceExit --passWithNoTests \
            --testPathPattern="guards/__tests__/(drift-guard|baseline-math|stage-0|stage-1|sd-2|sd-25|sd-26|sd-3)" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      # CLIENT-SEC-H1: cross-tenant/unauth Client PII containment (S1-S4) regression.
      # Explicit test -f guard: bir spec silinir/yeniden adlandırılırsa step FAIL eder (allowlist stale-test gap koruması).
      - name: CLIENT-SEC-H1 cross-tenant containment regression
        run: |
          cd apps/api
          for f in src/modules/uyap/__tests__/uyap-poa-tenant-scope.spec.ts \
                   src/modules/pdf/__tests__/pdf-takip-talebi-authz.spec.ts \
                   src/modules/validation-gate/__tests__/validation-gate-authz-tenant.spec.ts \
                   src/modules/template-engine/__tests__/template-artifact-tenant-scope.spec.ts; do
            test -f "$f" || { echo "MISSING CLIENT-SEC-H1 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(uyap-poa-tenant-scope|pdf-takip-talebi-authz|validation-gate-authz-tenant|template-artifact-tenant-scope)\.spec\.ts$"
        working-directory: project
      # CLIENT-SEC-H2A: EsignLog/UyapRequestLog fail-closed emergency containment regression.
      # Şema-seviyesi tenantId yokluğu (H2C ile kalıcı çözülecek) — bu, o zamana kadarki containment kanıtı.
      - name: CLIENT-SEC-H2A fail-closed containment regression
        run: |
          cd apps/api
          for f in src/modules/esign/__tests__/esign-h2a-containment.spec.ts \
                   src/modules/uyap/__tests__/uyap-history-h2a-containment.spec.ts; do
            test -f "$f" || { echo "MISSING CLIENT-SEC-H2A spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(esign-h2a-containment|uyap-history-h2a-containment)\.spec\.ts$"
        working-directory: project
      # CLIENT-SEC-H2B: code-level tenant-scope enforcement regression (template update,
      # UYAP case-status query, document/document-template fail-closed tenant guard).
      - name: CLIENT-SEC-H2B tenant-scope enforcement regression
        run: |
          cd apps/api
          for f in src/modules/client-notification/__tests__/client-notification-template-tenant-scope.spec.ts \
                   src/modules/uyap/__tests__/uyap-case-status-tenant-scope.spec.ts \
                   src/modules/document/__tests__/document-fail-closed-tenant.spec.ts; do
            test -f "$f" || { echo "MISSING CLIENT-SEC-H2B spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(client-notification-template-tenant-scope|uyap-case-status-tenant-scope|document-fail-closed-tenant)\.spec\.ts$"
        working-directory: project
      # CLIENT-SEC-H2C-P02: EsignLog/UyapRequestLog new-write tenant population regression.
      # P02-R1: 5 UYAP write yolunun log ownership'i trusted execution tenant'tan (DTO'dan DEĞİL) alması.
      - name: CLIENT-SEC-H2C-P02 tenant write population regression
        run: |
          cd apps/api
          for f in src/modules/esign/__tests__/esign-tenant-write-population.spec.ts \
                   src/modules/uyap/__tests__/uyap-tenant-write-population.spec.ts \
                   src/modules/uyap/__tests__/uyap-write-ownership-completion.spec.ts; do
            test -f "$f" || { echo "MISSING CLIENT-SEC-H2C-P02 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(esign-tenant-write-population|uyap-tenant-write-population|uyap-write-ownership-completion)\.spec\.ts$"
        working-directory: project
      # CLIENT-P0-T04-C1: CaseBalance tenant fail-closed containment regression.
      # getBalance/getLedger/credit/debit yollarının service-level ownership gate ile cross-tenant
      # read/write reddi + zero side-effect (F-STOP-1 kod-yolu exposure containment kanıtı).
      - name: CLIENT-P0-T04-C1 CaseBalance tenant containment regression
        run: |
          cd apps/api
          for f in src/modules/case-balance/__tests__/case-balance-tenant-isolation.spec.ts; do
            test -f "$f" || { echo "MISSING CLIENT-P0-T04-C1 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="case-balance-tenant-isolation\.spec\.ts$"
        working-directory: project
      - name: Integration Tests (legal-kernel, real Postgres)
        run: |
          cd apps/api
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(collection-payment-received|domain-event-ingest|uyap-event-ingest\.boundary)\.integration\.spec\.ts$"
        working-directory: project
      # ADR-014 W0.2: explicit selection prevents a green job from hiding an
      # unexecuted static boundary or disposable-DB materializer suite.
      - name: W0.2 materializer static boundary tests
        run: |
          cd apps/api
          test -f src/modules/interest-engine/__tests__/scenario-materializer.static.spec.ts || \
            { echo "MISSING W0.2 static spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-materializer\.static\.spec\.ts$"
        working-directory: project
      - name: W0.2 materializer disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/scenario-materializer.db-gated.integration.spec.ts || \
            { echo "MISSING W0.2 DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-materializer\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      - name: W0.3 diagnostic static and evidence tests
        run: |
          cd apps/api
          for f in src/modules/interest-engine/__tests__/scenario-diagnostic.static.spec.ts \
                   src/modules/interest-engine/__tests__/scenario-evidence.spec.ts; do
            test -f "$f" || { echo "MISSING W0.3 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(scenario-diagnostic\.static|scenario-evidence)\.spec\.ts$"
        working-directory: project
      - name: W0.3 diagnostic disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/scenario-diagnostic.db-gated.integration.spec.ts || \
            { echo "MISSING W0.3 DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-diagnostic\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # PR-A4-2: synthetic rich-interest evidence must execute explicitly on the
      # migrated disposable DB. Zero-match, renamed specs, skipped execution and
      # cleanup/golden drift are all CI-red; production exporters are never invoked.
      - name: PR-A4-2 rich-interest diagnostic fixture and disposable DB evidence
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          for f in src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.spec.ts \
                   src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.db-gated.integration.spec.ts; do
            test -f "$f" || { echo "MISSING PR-A4-2 spec: $f"; exit 1; }
          done
          set -o pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="rich-interest-uyap-readiness\.fixture(\.db-gated\.integration)?\.spec\.ts$" \
            2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+2 passed, 2 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 suites did not execute exactly twice"; exit 1; }
          grep -Eq "Tests:[[:space:]]+49 passed, 49 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 tests did not execute 49/49"; exit 1; }
        working-directory: project
      # ADR-014 PR-9: the Wave 0 ScenarioDefinition is the single fixture and
      # expected contract for both the in-memory and disposable-Postgres twins.
      - name: ADR-014 PR-9 golden fixture matrix unit tests
        run: |
          cd apps/api
          test -f src/modules/interest-engine/__tests__/golden-fixture-matrix.spec.ts || \
            { echo "MISSING ADR-014 PR-9 unit spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="golden-fixture-matrix\.spec\.ts$"
        working-directory: project
      - name: ADR-014 PR-9 golden fixture matrix disposable DB twin-run
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/golden-fixture-matrix.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-9 DB twin-run spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="golden-fixture-matrix\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # ADR-014 PR-10: the legacy calculation-summary response remains intact;
      # canonical evidence is exposed only through the additive, fail-closed adapter.
      - name: ADR-014 PR-10 compatibility adapter and contract tests
        run: |
          cd apps/api
          for f in src/modules/case/__tests__/case-calculation-summary.compatibility.spec.ts \
                   src/modules/case/__tests__/case-calculation-summary-shadow.spec.ts; do
            test -f "$f" || { echo "MISSING ADR-014 PR-10 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            src/modules/case/__tests__/case-calculation-summary.compatibility.spec.ts \
            src/modules/case/__tests__/case-calculation-summary-shadow.spec.ts
        working-directory: project
      - name: ADR-014 PR-10 compatibility adapter disposable DB acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/case/__tests__/case-calculation-summary.compatibility.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-10 DB acceptance spec"; exit 1; }
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            src/modules/case/__tests__/case-calculation-summary.compatibility.db-gated.integration.spec.ts
        working-directory: project
      # ADR014-PE-06A is a pure, default-disabled preparation shell. The source and both
      # security/functional specs must exist, remain dependency-free and execute explicitly.
      - name: ADR014-PE-06A disabled local evidence harness tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-disabled-local-evidence-harness.ts
          functional_spec=src/scripts/__tests__/adr014-disabled-local-evidence-harness.spec.ts
          security_spec=src/scripts/__tests__/adr014-disabled-local-evidence-harness.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06A file: $f"; exit 1; }
          done
          for pattern in '@nestjs/' '@prisma/' 'node:fs' 'node:path' 'node:http' 'node:https' \
                         'node:net' 'node:tls' 'AuditService' 'AuditLog' 'prom-client' \
                         'worker_threads' 'balance-display-shadow-diff' "from 'fs'" 'from "fs"' \
                         "from 'path'" 'from "path"' "from 'http'" 'from "http"' \
                         "from 'https'" 'from "https"' "from 'net'" 'from "net"' \
                         "from 'tls'" 'from "tls"' 'axios' 'fetch(' 'cron' 'bullmq' 'ioredis'; do
            if grep -F -n "$pattern" "$source_file" "$functional_spec" "$security_spec"; then
              echo "FORBIDDEN ADR014-PE-06A dependency: $pattern"; exit 1
            fi
          done
          if grep -E -n 'require\.main|process\.argv|process\.env|NestFactory|function[[:space:]]+main|Math\.random|randomUUID|Date\.' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06A execution or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|amount|principal|interest|fee|rawError|stack|reason|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06A payload field"; exit 1
          fi
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec"
        working-directory: project
      # ADR014-PE-06C1 remains preparation-only: v1 compatibility and the v2 mapper must stay
      # default-disabled, pure and dependency-free while all direct specs execute explicitly.
      - name: ADR014-PE-06C1 default-disabled observation contract tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-session-observation-producer.ts
          functional_spec=src/scripts/__tests__/adr014-session-observation-producer.spec.ts
          security_spec=src/scripts/__tests__/adr014-session-observation-producer.security.spec.ts
          compatibility_spec=src/modules/balance-display-shadow-diff/__tests__/balance-display-shadow-diff.events.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec" "$compatibility_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06C1 file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|http|https|net|tls|crypto)|process\.(env|argv)|NestFactory|Date\.|new Date|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|prom-client|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06C1 runtime or nondeterminism surface"; exit 1
          fi
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec" \
            "$compatibility_spec"
        working-directory: project
      # ADR014-PE-06D composes PE-06A/B1/C1 only in a default-disabled, synthetic,
      # test-only dry-validation shell. Runtime activation and external I/O remain forbidden.
      - name: ADR014-PE-06D local session orchestrator dry-validation tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-session-orchestrator-dry-validation.ts
          functional_spec=src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06D file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|path|http|https|net|tls|crypto)|process\.(env|argv)|NestFactory|new Date|Date\.|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06D runtime, I/O or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|principal|interest|fee|amount|currency|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06D business or financial payload field"; exit 1
          fi
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec"
        working-directory: project
      # ADR014-PE-06E defines only pure, default-disabled local preparation contracts.
      # Audit persistence, evidence acceptance, runtime telemetry, and alert delivery stay absent.
      - name: ADR014-PE-06E local observability surface contract tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-observability-surfaces.ts
          functional_spec=src/scripts/__tests__/adr014-local-observability-surfaces.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-observability-surfaces.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-PE-06E file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|path|http|https|net|tls)|process\.(env|argv)|NestFactory|Date\.now|Math\.random|randomUUID|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06E runtime, I/O or nondeterminism surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|amount|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-PE-06E business or sensitive payload field"; exit 1
          fi
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec"
        working-directory: project
      # ADR014-REP-01B is an exact local execution boundary, not an activated run.
      # It must remain default-disabled, local-only, read-only and free of network clients.
      - name: ADR014-REP-01B local read-only representative runner tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-local-read-only-representative-runner.ts
          functional_spec=src/scripts/__tests__/adr014-local-read-only-representative-runner.spec.ts
          security_spec=src/scripts/__tests__/adr014-local-read-only-representative-runner.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01B file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|node:(http|https|net|tls|dgram)|process\.(env|argv)|NestFactory|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01B runtime, egress or activation surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|rawError|stack|metadata' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01B business or sensitive payload field"; exit 1
          fi
          grep -F -q 'SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY' "$source_file" || \
            { echo "MISSING ADR014-REP-01B read-only transaction guard"; exit 1; }
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec" \
            src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.spec.ts \
            src/scripts/__tests__/adr014-local-session-orchestrator-dry-validation.security.spec.ts
        working-directory: project
      # ADR014-REP-01A validates run-specific owner references only. It cannot access data,
      # execute the runner, emit telemetry or promote evidence/PR-11/runtime authority.
      - name: ADR014-REP-01A run-specific authorization package tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-run-specific-authorization-package.ts
          functional_spec=src/scripts/__tests__/adr014-run-specific-authorization-package.spec.ts
          security_spec=src/scripts/__tests__/adr014-run-specific-authorization-package.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01A file: $f"; exit 1; }
          done
          if grep -E -n '@nestjs/|@prisma/|node:(fs|http|https|net|tls|dgram)|process\.(env|argv)|NestFactory|PrismaClient|fetch\(|axios|console\.|AuditLog|AuditService|prom-client|setTimeout|setInterval|function[[:space:]]+main|require\.main' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A runtime, persistence, egress or activation surface"; exit 1
          fi
          if grep -E -n 'tenantId|caseId|debtorId|creditorId|clientId|personId|rawError|stack|arbitraryMetadata' "$source_file"; then
            echo "FORBIDDEN ADR014-REP-01A business or sensitive payload field"; exit 1
          fi
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            "$functional_spec" \
            "$security_spec" \
            src/scripts/__tests__/adr014-disabled-local-evidence-harness.spec.ts \
            src/scripts/__tests__/adr014-local-read-only-representative-runner.spec.ts
        working-directory: project
      # ADR014-REP-01A-R2-I1 materializes owner decisions only. Runtime facts, execution,
      # data access and authority promotion remain forbidden.
      - name: ADR014-REP-01A-R2-I1 v2 pre-run package instance tests
        run: |
          cd apps/api
          source_file=src/scripts/adr014-v2-pre-run-package-instance.ts
          functional_spec=src/scripts/__tests__/adr014-v2-pre-run-package-instance.spec.ts
          security_spec=src/scripts/__tests__/adr014-v2-pre-run-package-instance.security.spec.ts
          for f in "$source_file" "$functional_spec" "$security_spec"; do
            test -f "$f" || { echo "MISSING ADR014-REP-01A-R2-I1 file: $f"; exit 1; }
