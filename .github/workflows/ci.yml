        working-directory: project/apps/api
      # UYAP-CPE-DECISION-LINK-WRITER-P05C-P03 (Karar C): DORMANT UyapAttemptCpeDecisionLink writer.
      # Actor/lawyer/signer input ALMAZ; M5 composite FK + @@unique([cpeDecisionLogId]) authoritative;
      # schema/migration EKLEMEZ. Duplicate semantics: exact replay=IDEMPOTENT, farkli iliski=CONFLICT,
      # FK uyusmazligi=INTEGRITY error (fail-closed). STEP 1 unit + dormancy/boundary guard: module
      # kaydi, actor input, controller/DTO gorulurse RED. STEP 2 disposable PostgreSQL 16'da idempotent
      # replay, conflict reddi, esszamanli race, cross-tenant/case/attempt reddi, rollback dogrulanir.
      - name: UYAP-P05C-P03 link writer unit and dormancy guard
        run: |
          spec=src/modules/uyap/operation-writer/uyap-cpe-decision-link-writer.service.spec.ts
          writer=src/modules/uyap/operation-writer/uyap-cpe-decision-link-writer.service.ts
          for f in "$spec" "$writer" \
