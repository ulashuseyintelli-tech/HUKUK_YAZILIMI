            test -f "$f" || { echo "MISSING MPB-028(a) PR-3C spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runTestsByPath \
            src/modules/legal-deadline/__tests__/legal-period-rule-matrix.spec.ts \
            src/modules/legal-deadline/__tests__/proceeding-classification.service.spec.ts \
            src/modules/legal-deadline/__tests__/legal-period-calculation.service.spec.ts \
            src/modules/legal-deadline/__tests__/proceeding-classification.static-guard.spec.ts
        working-directory: project
      # MPB-028(a) PR-3C (disposable-DB kısmı): gerçek Postgres'te Case.proceedingType/
      # rentalType/bankruptcyType/judgmentExecutionType sütunlarından doğru sınıflandırma +
      # süre hesabı, tenant-isolation ve read-only (satır yazmama) davranışını doğrular.
      - name: MPB-028(a) PR-3C proceeding-type rule matrix disposable-DB tests
        env:
