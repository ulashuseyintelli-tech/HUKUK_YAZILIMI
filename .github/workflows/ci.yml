# CI Pipeline - Core Checks
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı ref için devam eden eski koşuyu iptal et (maliyet: çift/yığılan run önleme).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project

jobs:
  architectural-guardrails:
    name: Architectural Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-007 check
        run: |
          if grep -r "req\.idempotencyContext\s*=" apps/api/src/; then
            echo "ADR-007 VIOLATION"; exit 1
          fi
      - name: CI-1 Bare fetch gate
        run: bash apps/api/scripts/ci-1-bare-fetch-gate.sh
      - name: CI-2 PII log leak gate
        run: bash apps/api/scripts/ci-2-pii-log-leak-gate.sh
      - name: CI-3 Scheduler unbounded gate
        run: bash apps/api/scripts/ci-3-scheduler-unbounded-gate.sh
      - name: CI-4 Trust proxy gate
        run: bash apps/api/scripts/ci-4-trust-proxy-gate.sh
      - name: CI-5 Scheduler metrics gate
        run: bash apps/api/scripts/ci-5-scheduler-metrics-gate.sh
      - name: CI-6 Symbol token singleton gate
        run: bash apps/api/scripts/ci-6-symbol-token-singleton-gate.sh
      - name: CI-7 Web no submission-level promote gate
        run: bash apps/api/scripts/ci-7-web-no-submission-promote-gate.sh

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: project
      - name: Prisma generate
        run: pnpm --filter @hukuk/api exec prisma generate
        working-directory: project
      - name: Prisma migrate deploy
        run: pnpm --filter @hukuk/api exec prisma migrate deploy
        working-directory: project
      - name: Type check
        run: pnpm --filter @hukuk/api exec tsc --noEmit -p tsconfig.prod.json
        working-directory: project
      - name: Tests
        run: |
          cd apps/api
          npx jest --ci --forceExit --passWithNoTests \
            --testPathPattern="guards/__tests__/(drift-guard|baseline-math|stage-0|stage-1|sd-2|sd-25|sd-26|sd-3)" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      - name: Integration Tests (legal-kernel, real Postgres)
        run: |
          cd apps/api
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(collection-payment-received|domain-event-ingest|uyap-event-ingest\.boundary)\.integration\.spec\.ts$"
        working-directory: project
      # ADR-014 W0.2: explicit selection prevents a green job from hiding an
      # unexecuted static boundary or disposable-DB materializer suite.
      - name: W0.2 materializer static boundary tests
        run: |
          cd apps/api
          test -f src/modules/interest-engine/__tests__/scenario-materializer.static.spec.ts || \
            { echo "MISSING W0.2 static spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-materializer\.static\.spec\.ts$"
        working-directory: project
      - name: W0.2 materializer disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/scenario-materializer.db-gated.integration.spec.ts || \
            { echo "MISSING W0.2 DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-materializer\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      - name: W0.3 diagnostic static and evidence tests
        run: |
          cd apps/api
          for f in src/modules/interest-engine/__tests__/scenario-diagnostic.static.spec.ts \
                   src/modules/interest-engine/__tests__/scenario-evidence.spec.ts; do
            test -f "$f" || { echo "MISSING W0.3 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(scenario-diagnostic\.static|scenario-evidence)\.spec\.ts$"
        working-directory: project
      - name: W0.3 diagnostic disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/scenario-diagnostic.db-gated.integration.spec.ts || \
            { echo "MISSING W0.3 DB-gated spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="scenario-diagnostic\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # PR-A4-2: synthetic rich-interest evidence must execute explicitly on the
      # migrated disposable DB. Zero-match, renamed specs, skipped execution and
      # cleanup/golden drift are all CI-red; production exporters are never invoked.
      - name: PR-A4-2 rich-interest diagnostic fixture and disposable DB evidence
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          for f in src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.spec.ts \
                   src/modules/case/inventory/__tests__/rich-interest-uyap-readiness.fixture.db-gated.integration.spec.ts; do
            test -f "$f" || { echo "MISSING PR-A4-2 spec: $f"; exit 1; }
          done
          set -o pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="rich-interest-uyap-readiness\.fixture(\.db-gated\.integration)?\.spec\.ts$" \
            2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+2 passed, 2 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 suites did not execute exactly twice"; exit 1; }
          grep -Eq "Tests:[[:space:]]+49 passed, 49 total" "$output_file" || \
            { echo "BLOCKED: PR-A4-2 tests did not execute 49/49"; exit 1; }
        working-directory: project
      # ADR-014 PR-9: the Wave 0 ScenarioDefinition is the single fixture and
      # expected contract for both the in-memory and disposable-Postgres twins.
      - name: ADR-014 PR-9 golden fixture matrix unit tests
        run: |
          cd apps/api
          test -f src/modules/interest-engine/__tests__/golden-fixture-matrix.spec.ts || \
            { echo "MISSING ADR-014 PR-9 unit spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="golden-fixture-matrix\.spec\.ts$"
        working-directory: project
      - name: ADR-014 PR-9 golden fixture matrix disposable DB twin-run
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/interest-engine/__tests__/golden-fixture-matrix.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-9 DB twin-run spec"; exit 1; }
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="golden-fixture-matrix\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # ADR-014 PR-10: the legacy calculation-summary response remains intact;
      # canonical evidence is exposed only through the additive, fail-closed adapter.
      - name: ADR-014 PR-10 compatibility adapter and contract tests
        run: |
          cd apps/api
          for f in src/modules/case/__tests__/case-calculation-summary.compatibility.spec.ts \
                   src/modules/case/__tests__/case-calculation-summary-shadow.spec.ts; do
            test -f "$f" || { echo "MISSING ADR-014 PR-10 spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            src/modules/case/__tests__/case-calculation-summary.compatibility.spec.ts \
            src/modules/case/__tests__/case-calculation-summary-shadow.spec.ts
        working-directory: project
      - name: ADR-014 PR-10 compatibility adapter disposable DB acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/case/__tests__/case-calculation-summary.compatibility.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-10 DB acceptance spec"; exit 1; }
          npx jest --ci --forceExit --runInBand --runTestsByPath \
            src/modules/case/__tests__/case-calculation-summary.compatibility.db-gated.integration.spec.ts
        working-directory: project
      # ADR-014 PR-1B: retain the PR-1A CaseBalance selection and add the pure
      # mapper regression explicitly; rename/removal/zero-match must fail closed.
      - name: ADR-014 PR-1B reversal-netting unit and orchestration tests
        run: |
          cd apps/api
          for f in src/modules/interest-engine/calc-prep/__tests__/payment-mapper.spec.ts \
                   src/modules/interest-engine/orchestration/__tests__/case-balance.service.spec.ts; do
            test -f "$f" || { echo "MISSING ADR-014 PR-1B spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="src/modules/interest-engine/(calc-prep/__tests__/payment-mapper|orchestration/__tests__/case-balance\.service)\.spec\.ts$"
        working-directory: project
      # ADR-014 PR-1B: real CollectionService.create -> cancel -> CaseBalance
      # acceptance evidence must execute on disposable PostgreSQL; skipped/zero-test is RED.
      - name: ADR-014 PR-1B real cancellation disposable DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          test -f src/modules/collection/__tests__/collection-cancel-reversal.db-gated.integration.spec.ts || \
            { echo "MISSING ADR-014 PR-1B DB-gated spec"; exit 1; }
          set -o pipefail
          output_file="$(mktemp)"
          npx jest --ci --forceExit --runInBand --verbose \
            --testPathPattern="src/modules/collection/__tests__/collection-cancel-reversal\.db-gated\.integration\.spec\.ts$" \
            2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+1 passed, 1 total" "$output_file" || \
            { echo "BLOCKED: ADR-014 PR-1B DB suite did not execute exactly once"; exit 1; }
          grep -Eq "Tests:[[:space:]]+4 passed, 4 total" "$output_file" || \
            { echo "BLOCKED: ADR-014 PR-1B DB tests did not execute 4/4"; exit 1; }
        working-directory: project
      # TEST-INFRA-1: Gate-1 (tenant-boundary) + Gate-2 (passive-writer) güvenlik spec'leri yukarıdaki
      # dar pattern'lerin dışında kalıyordu → CI'da koşmuyordu. Ayrı/açık step ile koşturulur.
      # passWithNoTests YOK + önce dosya-varlığı pre-check: rename/silme veya 0-eşleşme → CI RED.
      - name: Security boundary tests (Gate-1 tenant + Gate-2/3 passive-writer + Gate-4 identity)
        run: |
          cd apps/api
          for f in src/modules/address-discovery/confidence-score.tenant-boundary.spec.ts \
                   src/modules/debtor/ihbarname-summary.tenant-boundary.spec.ts \
                   src/modules/debtor/third-party-passive-writer.spec.ts \
                   src/modules/debtor/quick-note-passive-writer.spec.ts \
                   src/modules/debtor/debtor-identity-format.spec.ts; do
            test -f "$f" || { echo "MISSING security spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit \
            --testPathPattern="(confidence-score\.tenant-boundary|ihbarname-summary\.tenant-boundary|third-party-passive-writer|quick-note-passive-writer|debtor-identity-format)\.spec\.ts$" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      # GATE-1 CI Tenant-Isolation Regression Coverage: Borçlu Wave 0 (MPB-028/OD-3/PR-EA) tenant-
      # boundary unit+static spec'leri yukarıdaki dar pattern'lerin dışında kalıyordu → CI'da hiç
      # koşmuyordu (yalnız local `pnpm test` ile çalışırdı — GATE-1'in "cross-tenant testler yeşil"
      # kriteri sürekli doğrulanamıyordu). Ayrı/açık step ile koşturulur. passWithNoTests YOK +
      # önce dosya-varlığı pre-check: rename/silme veya 0-eşleşme → CI RED. Açık liste dizin-bazlı
      # regex yerine bilinçli tercih edildi: enforcement-action-backfill-* dosyaları farklı bir
      # dizinde (src/scripts/__tests__/), ve automation/__tests__/ altında tenant-ilgisiz dosyalar
      # (rfa007-enforcement-guard, automation.service, poa-expiry-delivery) da var — dizin-geneli
      # bir glob bunları yanlışlıkla dahil ederdi. Yeni Wave 0 tenant testi eklenirse bu listeye
      # açıkça eklenmelidir (bkz. maintenance-register.md notu).
      - name: Wave 0 tenant-boundary unit/static tests (Risk/AI/Notification/WorkflowEngine/EnforcementAction)
        run: |
          cd apps/api
          for f in src/modules/risk/risk.service.tenant-boundary.spec.ts \
                   src/modules/ai/ai.service.tenant-boundary.spec.ts \
                   src/modules/notification/notification.service.tenant-boundary.spec.ts \
                   src/modules/automation/__tests__/automation-tenant-guard-propagation.spec.ts \
                   src/modules/automation/__tests__/workflow-engine-build-context-tenant-guard.spec.ts \
                   src/modules/automation/__tests__/workflow-engine-build-context-tenant-guard.static-guard.spec.ts \
                   src/modules/automation/__tests__/workflow-engine-remaining-tenant-boundaries.spec.ts \
                   src/modules/automation/__tests__/workflow-engine-remaining-tenant-boundaries.static-guard.spec.ts \
                   src/modules/automation/__tests__/enforcement-action-guarded-write-path.spec.ts \
                   src/modules/automation/__tests__/enforcement-action-guarded-write-path.static-guard.spec.ts \
                   src/scripts/__tests__/enforcement-action-backfill-classifier.spec.ts \
                   src/scripts/__tests__/enforcement-action-backfill-profiler.report-hardening.spec.ts \
                   src/scripts/__tests__/enforcement-action-backfill-profiler.static-purity.spec.ts; do
            test -f "$f" || { echo "MISSING Wave 0 tenant spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit \
            --testPathPattern="(risk\.service\.tenant-boundary|ai\.service\.tenant-boundary|notification\.service\.tenant-boundary|automation-tenant-guard-propagation|workflow-engine-build-context-tenant-guard\.static-guard|workflow-engine-build-context-tenant-guard|workflow-engine-remaining-tenant-boundaries\.static-guard|workflow-engine-remaining-tenant-boundaries|enforcement-action-guarded-write-path\.static-guard|enforcement-action-guarded-write-path|enforcement-action-backfill-classifier|enforcement-action-backfill-profiler\.report-hardening|enforcement-action-backfill-profiler\.static-purity)\.spec\.ts$" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      # GATE-1 CI Tenant-Isolation Regression Coverage (disposable-DB kısmı): aynı Wave 0 ailesinin
      # composite where-clause'ının gerçek Postgres üzerinde doğru davrandığını doğrulayan
      # entegrasyon testleri de aynı nedenle CI'da hiç koşmuyordu. Mevcut job'ın Postgres service'i
      # (yukarıdaki `services: postgres:`) reuse edilir — yeni container/job YOK.
      - name: Wave 0 tenant-boundary disposable-DB tests (WorkflowEngine/EnforcementAction)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
          for f in src/modules/automation/__tests__/workflow-engine-build-context-tenant-guard.db-gated.integration.spec.ts \
                   src/modules/automation/__tests__/workflow-engine-remaining-tenant-boundaries.db-gated.integration.spec.ts \
                   src/modules/automation/__tests__/enforcement-action-guarded-write-path.db-gated.integration.spec.ts \
                   src/modules/automation/__tests__/enforcement-action-tenant-case-debtor-fk.db-gated.integration.spec.ts \
                   src/scripts/__tests__/enforcement-action-backfill-profiler.db-gated.integration.spec.ts; do
            test -f "$f" || { echo "MISSING Wave 0 tenant DB-gated spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit --runInBand \
            --testPathPattern="(workflow-engine-build-context-tenant-guard|workflow-engine-remaining-tenant-boundaries|enforcement-action-guarded-write-path|enforcement-action-tenant-case-debtor-fk|enforcement-action-backfill-profiler)\.db-gated\.integration\.spec\.ts$"
        working-directory: project
      # PR-1 (güvenlik): RBAC + metadata redaction + source/tenant/level spoof engeli.
      # PR-2a (observability): global ExceptionFilter + requestId + fingerprint + flood-guard
      # + server-log builder (≥500 logging, 4xx noise exclusion, logging isolation).
      # Dosya-varlığı pre-check (rename/silme → CI RED) + passWithNoTests YOK.
      - name: Error-log security & observability tests (PR-1/2a/2b/3)
        run: |
          cd apps/api
          for f in src/modules/error-log/__tests__/error-log.sanitize.spec.ts \
                   src/modules/error-log/__tests__/error-log.controller.spec.ts \
                   src/modules/error-log/__tests__/error-fingerprint.spec.ts \
                   src/modules/error-log/__tests__/error-flood-guard.spec.ts \
                   src/modules/error-log/__tests__/server-log.builder.spec.ts \
                   src/modules/error-log/__tests__/all-exceptions.filter.spec.ts \
                   src/modules/error-log/__tests__/error-dedupe-key.spec.ts \
                   src/modules/error-log/__tests__/error-log.dedupe.service.spec.ts \
                   src/modules/error-log/__tests__/error-reporter.spec.ts; do
            test -f "$f" || { echo "MISSING error-log spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit \
            --testPathPattern="error-log/__tests__/.*\.spec\.ts$" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project
      # CLIENT-LANE-1: client modülü saf unit spec'leri (mock prisma, DB GEREKMEZ) yukarıdaki dar
      # pattern'lerin dışında kalıyordu → CI'da koşmuyordu (#656 client-update-duplicate-guard false-green
      # ile merge oldu; #661 harness'i düzeltti). Ayrı/açık step ile koşturulur.
      # Dosya-varlığı pre-check (rename/silme veya 0-eşleşme → CI RED) + passWithNoTests YOK.
      - name: Client module tests (client-lane false-green guard)
        run: |
          cd apps/api
          for f in src/modules/client/__tests__/client-core-p0.spec.ts \
                   src/modules/client/__tests__/client-update-duplicate-guard.spec.ts \
                   src/modules/client/__tests__/client-audit.spec.ts \
                   src/modules/client/__tests__/client-reactivate.spec.ts \
                   src/modules/client/__tests__/contact-followup.spec.ts \
                   src/modules/client/__tests__/client-controller-validation.spec.ts; do
            test -f "$f" || { echo "MISSING client spec: $f"; exit 1; }
          done
          npx jest --ci --forceExit \
            --testPathPattern="src/modules/client/__tests__/.*\.spec\.ts$" \
            --testPathIgnorePatterns="node_modules|dist|integration"
        working-directory: project

  # Frontend (apps/web) vitest — jsdom unit/component testleri. DB/prisma GEREKMEZ.
  # RFA-018: web testleri artık CI'da; kırmızı web testi merge'i bloklar.
  web-tests:
    name: Web Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: project
      - name: Web vitest (jsdom)
        run: pnpm --filter @hukuk/web test
        working-directory: project
      # SB-013: next build gate — vitest geçse de route/slug/tip build kırıklarını yakalar (#185 dersi:
      # /intake/[token] vs (dashboard)/intake/[id] slug conflict CI yeşilken web BOOT olmamıştı).
      # DB/prisma/API/env GEREKMEZ (next build = statik derleme + type-check + lint + route-collect;
      # lokal doğrulandı: BUILD_EXIT=0). package.json değişmedi; mevcut build script'i (next build) kullanılır.
      - name: Web build (next build)
        run: pnpm --filter @hukuk/web build
        working-directory: project
  client-workspace-live-smoke:
    name: Client Workspace Live Smoke
    runs-on: ubuntu-latest
    needs: [test-suite, web-tests]
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
      JWT_SECRET: client-workspace-live-smoke-ci-secret
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 8080
      CORS_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:8080
      CLIENT_WORKSPACE_LIVE_SMOKE: "1"
      CLIENT_WORKSPACE_WEB_BASE_URL: http://localhost:3002
      CLIENT_WORKSPACE_API_BASE_URL: http://localhost:8080
      CLIENT_WORKSPACE_SMOKE_CLIENT_ID: client-workspace-live-smoke-v1-client
      CLIENT_WORKSPACE_SMOKE_EMAIL: admin@hukuk.com
      CLIENT_WORKSPACE_SMOKE_PASSWORD: admin123
      ALLOW_CLIENT_WORKSPACE_LIVE_SMOKE_SEED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: project
      - name: Disable optional pdf-poppler for Client Workspace smoke runtime
        run: |
          pnpm --filter @hukuk/api exec node -e "const fs = require('fs'); const p = require.resolve('pdf-poppler'); fs.writeFileSync(p, 'module.exports = { convert: async () => { throw new Error(\"pdf-poppler disabled in Client Workspace live smoke CI\"); } };\n'); console.log('Stubbed optional pdf-poppler at ' + p);"
        working-directory: project
      - name: Prisma generate
        run: pnpm --filter @hukuk/api exec prisma generate
        working-directory: project
      - name: Prisma migrate deploy
        run: pnpm --filter @hukuk/api exec prisma migrate deploy
        working-directory: project
      - name: Seed base data
        run: pnpm --filter @hukuk/api db:seed
        working-directory: project
      - name: Seed Client Workspace live smoke fixture
        id: seed-client-workspace-fixture
        run: pnpm --filter @hukuk/api seed:client-workspace-live-smoke -- --reset
        working-directory: project
      - name: Build API
        run: pnpm --filter @hukuk/api build
        working-directory: project
      - name: Build Web
        run: pnpm --filter @hukuk/web build
        working-directory: project
      - name: Install Playwright Chromium
        run: pnpm --filter @hukuk/web exec playwright install --with-deps chromium
        working-directory: project
      - name: Start API
        run: |
          pnpm --filter @hukuk/api start > api-live-smoke.log 2>&1 &
          echo $! > api-live-smoke.pid
        working-directory: project
      - name: Start Web
        run: |
          PORT=3002 pnpm --filter @hukuk/web start > web-live-smoke.log 2>&1 &
          echo $! > web-live-smoke.pid
        working-directory: project
      - name: Wait for API and Web
        run: |
          for i in {1..60}; do
            if curl --silent http://localhost:8080/api/auth/me >/dev/null 2>&1; then
              api_ready=1
            fi
            if curl --fail --silent http://localhost:3002 >/dev/null 2>&1; then
              web_ready=1
            fi
            if [ "${api_ready:-0}" = "1" ] && [ "${web_ready:-0}" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API/Web readiness timeout"
          echo "--- API log ---"
          cat api-live-smoke.log || true
          echo "--- Web log ---"
          cat web-live-smoke.log || true
          exit 1
        working-directory: project
      - name: Client Workspace Playwright live smoke
        run: pnpm --filter @hukuk/web smoke:client-workspace
        working-directory: project
      - name: Cleanup Client Workspace live smoke fixture
        if: always() && steps.seed-client-workspace-fixture.outcome == 'success'
        run: pnpm --filter @hukuk/api seed:client-workspace-live-smoke -- --cleanup
        working-directory: project
      - name: Stop API and Web
        if: always()
        run: |
          if [ -f api-live-smoke.pid ]; then kill "$(cat api-live-smoke.pid)" 2>/dev/null || true; fi
          if [ -f web-live-smoke.pid ]; then kill "$(cat web-live-smoke.pid)" 2>/dev/null || true; fi
        working-directory: project
      - name: Upload Client Workspace live smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-workspace-live-smoke-diagnostics
          path: |
            project/api-live-smoke.log
            project/web-live-smoke.log
            project/apps/web/playwright-report/client-workspace
            project/apps/web/test-results
