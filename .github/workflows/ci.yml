          set -o pipefail
          output_file="$(mktemp)"
          pnpm exec jest --ci --forceExit --runInBand --runTestsByPath "$spec" 2>&1 | tee "$output_file"
          grep -Eq "Test Suites:[[:space:]]+1 passed, 1 total" "$output_file" || \
