      # (bkz. GATE-1/PR-2/PR-3 emsali) baştan önlenmek için bu PR'ın kendi merge'inde eklenmiştir.
      - name: MPB-028(a) PR-3C proceeding-type rule matrix unit/static tests
        run: |
          cd apps/api
