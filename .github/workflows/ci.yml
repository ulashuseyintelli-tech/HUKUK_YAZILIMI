          awk '/^[[:space:]]*Tests:/ { seen=1; passed=$2; total=$4 } END { exit !(seen && passed ~ /^[0-9]+$/ && total ~ /^[0-9]+$/ && passed==total && total>0) }' "$output_file" || \
            { echo "BLOCKED: P05C-P03 DB tests did not complete with every discovered test passing"; exit 1; }
        working-directory: project/apps/api
      # POLICY-CPE-DECISION-COMPOSITE-KEY-P05C-P01: CpeDecisionLog'u gelecekteki tenant-safe UYAP
      # evidence linkage icin composite FK HEDEFI yapar. Kapsam BILINCLI olarak tek additive unique
      # index: tenantId kolonu YOK, backfill YOK, link tablosu YOK, write-path DEGISMEZ.
      # STEP 1 statik kontrat + migration guard: migration TEK statement olmali ve yalnizca
      # CREATE UNIQUE INDEX icermeli; ALTER/DROP/CREATE TABLE veya DML gorulurse RED.
      # STEP 2 disposable PostgreSQL 16'da index'in UNIQUE kuruldugunu, PK/FK'nin korundugunu ve
      # migration'in HIC veri yazmadigini dogrular; skipped/zero-test RED.
      - name: P05C-P01 CpeDecisionLog composite key static contract
        run: |
          spec=src/modules/policy-engine/decision-logger/__tests__/cpe-decision-composite-key.static.spec.ts
          migration=prisma/migrations/20260722230000_cpe_decision_composite_reference_key/migration.sql
          test -f "$spec" || { echo "MISSING P05C-P01 static spec: $spec"; exit 1; }
          test -f "$migration" || { echo "MISSING P05C-P01 migration: $migration"; exit 1; }
          statements="$(grep -c ';' "$migration")"
          test "$statements" -eq 1 || { echo "FORBIDDEN P05C-P01: migration must contain exactly 1 statement (found $statements)"; exit 1; }
          grep -qE '^CREATE UNIQUE INDEX "CpeDecisionLog_id_caseId_key"' "$migration" || \
            { echo "MISSING P05C-P01 composite unique index statement"; exit 1; }
          if grep -inE '^[[:space:]]*(update|insert|delete|truncate|drop|alter)[[:space:]]|CREATE TABLE|tenantId' "$migration"; then
            echo "FORBIDDEN P05C-P01: non-additive DDL, DML or tenantId in migration"; exit 1
          fi
        working-directory: project/apps/api
      - name: P05C-P01 CpeDecisionLog composite key disposable DB acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          spec=src/modules/policy-engine/decision-logger/__tests__/cpe-decision-composite-key.db-gated.integration.spec.ts
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
