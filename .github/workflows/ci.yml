      # feature-flag-kapalı no-op davranışının gerçek Postgres üzerinde doğru çalıştığını
      # doğrular. Mevcut job'ın Postgres service'i reuse edilir — yeni container/job YOK.
      # Evidence Activation turunda aynı dosyaya LegalTimeShadowController uçtan uca (gerçek
      # servis + gerçek DB) testleri de eklendi — ayrı bir step gerekmez, mevcut dar pattern
      # zaten dosya adına göre eşleşir.
      - name: MPB-028(a) PR-3 legal-time-shadow disposable-DB tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
        run: |
          cd apps/api
          test -n "$TEST_DATABASE_URL" || { echo "BLOCKED: TEST_DATABASE_URL is required"; exit 1; }
