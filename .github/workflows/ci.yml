            test -f "$f" || { echo "MISSING P05C-P03 file: $f"; exit 1; }
          done
          # P05C-P04 UYARLAMASI: link writer artık YETKİLİ (module kaydı + orchestrator). Guard DARALTILDI:
          # UyapService raw link-writer'ı DOĞRUDAN kullanamaz (yalnız orchestrator yoluyla).
          if grep -nE 'UyapCpeDecisionLinkWriterService' src/modules/uyap/uyap.service.ts; then
            echo "FORBIDDEN P05C-P04: UyapService raw link-writer'i DOGRUDAN kullanamaz (yalniz orchestrator)"; exit 1
          fi
          if grep -nE 'actorUserId|actingLawyerId|signatureOwnerId|approverId|canPerformAction|Controller' "$writer"; then
            echo "FORBIDDEN P05C-P03 surface: actor/lawyer/signer input, CPE decision or controller"; exit 1
